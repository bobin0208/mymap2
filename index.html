<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>영화관 스폿 지도</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      background-color: #1a1a2e;
      color: #ffffff;
      padding: 16px 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }
    header h1 {
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 4px;
    }
    header p {
      font-size: 0.85rem;
      color: #b0b0c0;
    }
    .control-panel {
      display: flex;
      gap: 10px;
      padding: 12px 20px;
      background-color: #f8f9fa;
      border-bottom: 1px solid #e9ecef;
    }
    .btn {
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      background-color: #e50914;
      color: white;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.9rem;
      transition: background-color 0.2s;
    }
    .btn:hover {
      background-color: #b80710;
    }
    .btn-secondary {
      background-color: #4a4e69;
    }
    .btn-secondary:hover {
      background-color: #22223b;
    }
    #map {
      flex: 1;
      width: 100%;
      height: 100%;
    }
    .custom-overlay {
      position: relative;
      bottom: 50px;
      border-radius: 8px;
      border: 1px solid #ccc;
      border-bottom: 2px solid #ddd;
      float: left;
      background: #fff;
      padding: 10px 14px;
      box-shadow: 0px 3px 10px rgba(0,0,0,0.2);
    }
    .custom-overlay .title {
      font-weight: bold;
      font-size: 14px;
      color: #111;
      margin-bottom: 4px;
    }
    .custom-overlay .desc {
      font-size: 12px;
      color: #666;
    }
    .info-window {
      padding: 12px;
      font-size: 13px;
      max-width: 220px;
      line-height: 1.4;
    }
    .info-window h4 {
      font-size: 14px;
      color: #1a1a2e;
      margin-bottom: 6px;
    }
    .info-window p {
      color: #555;
      margin-bottom: 8px;
    }
    .info-window a {
      color: #e50914;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
  <!-- 카카오맵 API 스크립트 (appkey 부분에 본인 API 키 입력) -->
  <script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=23bd2ab8a894761d1b68c263c015b43a&libraries=services"></script>
</head>
<body>

  <header>
    <h1>🎬 내 위치 근처 영화관 스폿 지도</h1>
    <p>가장 가까운 영화관과 상영 포맷 정보를 확인해 보세요!</p>
  </header>

  <div class="control-panel">
    <button class="btn" onclick="searchCinemas()">🍿 주변 영화관 찾기</button>
    <button class="btn btn-secondary" onclick="moveToCurrentLocation()">📍 내 위치로 이동</button>
  </div>

  <div id="map"></div>

  <script>
    let map;
    let ps;
    let infowindow;
    let currentOverlay = null;
    let markers = [];
    let userLocationMarker = null;

    let currentLat = 37.5665;
    let currentLng = 126.9780;

    // 🍿 웹에서 바로 연결되는 팝콘 아이콘 URL 설정
    const cinemaMarkerImageSrc = 'https://img.icons8.com/emoji/96/popcorn-emoji.png'; 
    const imageSize = new kakao.maps.Size(42, 42); // 팝콘 마커 크기
    const imageOption = { offset: new kakao.maps.Point(21, 42) };
    const markerImage = new kakao.maps.MarkerImage(cinemaMarkerImageSrc, imageSize, imageOption);

    function initMap() {
      const container = document.getElementById('map');
      const options = {
        center: new kakao.maps.LatLng(currentLat, currentLng),
        level: 4
      };

      map = new kakao.maps.Map(container, options);
      ps = new kakao.maps.services.Places();
      infowindow = new kakao.maps.InfoWindow({ zIndex: 1 });

      moveToCurrentLocation();
    }

    function moveToCurrentLocation() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          (position) => {
            currentLat = position.coords.latitude;
            currentLng = position.coords.longitude;
            const locPosition = new kakao.maps.LatLng(currentLat, currentLng);

            if (userLocationMarker) userLocationMarker.setMap(null);

            userLocationMarker = new kakao.maps.Marker({
              map: map,
              position: locPosition
            });

            map.setCenter(locPosition);
            showCustomOverlay(locPosition, '📍 현재 위치', '여기 근처의 영화관을 검색합니다.');
            searchCinemas();
          },
          () => {
            alert('현재 위치 정보를 가져올 수 없어 기본 위치로 설정합니다.');
            searchCinemas();
          }
        );
      } else {
        alert('이 브라우저에서는 위치 서비스를 지원하지 않습니다.');
        searchCinemas();
      }
    }

    function searchCinemas() {
      removeMarkers();
      if (currentOverlay) currentOverlay.setMap(null);

      const center = map.getCenter();
      
      ps.keywordSearch('영화관', placesSearchCB, {
        location: center,
        radius: 5000
      });
    }

    function placesSearchCB(data, status) {
      if (status === kakao.maps.services.Status.OK) {
        const bounds = new kakao.maps.LatLngBounds();

        for (let i = 0; i < data.length; i++) {
          displayCinemaMarker(data[i]);
          bounds.extend(new kakao.maps.LatLng(data[i].y, data[i].x));
        }

        map.setBounds(bounds);
      } else if (status === kakao.maps.services.Status.ZERO_RESULT) {
        alert('주변에 검색된 영화관이 없습니다.');
      } else if (status === kakao.maps.services.Status.ERROR) {
        alert('검색 중 오류가 발생했습니다.');
      }
    }

    function displayCinemaMarker(place) {
      const markerPosition = new kakao.maps.LatLng(place.y, place.x);

      const marker = new kakao.maps.Marker({
        map: map,
        position: markerPosition,
        image: markerImage // 🍿 팝콘 마커 적용
      });

      markers.push(marker);

      kakao.maps.event.addListener(marker, 'click', function () {
        const content = `
          <div class="info-window">
            <h4>${place.place_name}</h4>
            <p>${place.road_address_name || place.address_name}</p>
            <p style="color: #888;">전화: ${place.phone || '정보 없음'}</p>
            <a href="${place.place_url}" target="_blank">카카오맵 상세보기 ➔</a>
          </div>
        `;
        infowindow.setContent(content);
        infowindow.open(map, marker);

        showCustomOverlay(markerPosition, place.place_name, '상영 포맷 및 예매 정보를 확인해보세요!');
      });
    }

    function showCustomOverlay(position, title, desc) {
      if (currentOverlay) {
        currentOverlay.setMap(null);
      }

      const content = `
        <div class="custom-overlay">
          <div class="title">${title}</div>
          <div class="desc">${desc}</div>
        </div>
      `;

      currentOverlay = new kakao.maps.CustomOverlay({
        map: map,
        position: position,
        content: content,
        yAnchor: 1.3
      });
    }

    function removeMarkers() {
      for (let i = 0; i < markers.length; i++) {
        markers[i].setMap(null);
      }
      markers = [];
    }

    window.onload = initMap;
  </script>
</body>
</html>
