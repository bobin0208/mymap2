<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>영화관 포맷 & 스폿 지도</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      background-color: #111827;
      color: #ffffff;
      padding: 16px 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    header h1 {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 4px;
    }
    header p {
      font-size: 0.85rem;
      color: #9ca3af;
    }
    .control-panel {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 12px 20px;
      background-color: #f3f4f6;
      border-bottom: 1px solid #e5e7eb;
      align-items: center;
    }
    .btn {
      padding: 8px 14px;
      border: 1px solid #d1d5db;
      border-radius: 20px;
      background-color: #ffffff;
      color: #374151;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.2s;
    }
    .btn:hover {
      background-color: #f9fafb;
      border-color: #9ca3af;
    }
    .btn.active {
      background-color: #e50914;
      color: #ffffff;
      border-color: #e50914;
    }
    .btn-location {
      margin-left: auto;
      background-color: #1f2937;
      color: #ffffff;
      border: none;
    }
    .btn-location:hover {
      background-color: #111827;
    }
    #map {
      flex: 1;
      width: 100%;
      height: 100%;
    }
    /* 커스텀 말풍선 */
    .custom-overlay {
      position: relative;
      bottom: 60px;
      border-radius: 8px;
      border: 1px solid #374151;
      background: #1f2937;
      color: #ffffff;
      padding: 8px 12px;
      box-shadow: 0px 4px 12px rgba(0,0,0,0.3);
      font-size: 13px;
      font-weight: 600;
    }
    /* 마커 상세 팝업 */
    .info-window {
      padding: 14px;
      font-size: 13px;
      width: 250px;
      line-height: 1.5;
    }
    .info-window h4 {
      font-size: 15px;
      color: #111827;
      margin-bottom: 6px;
    }
    .format-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin: 8px 0;
    }
    .tag {
      font-size: 10px;
      font-weight: bold;
      padding: 2px 6px;
      border-radius: 4px;
      color: white;
    }
    .tag-imax { background-color: #0070d2; }
    .tag-dolby { background-color: #000000; }
    .tag-4dx { background-color: #e63946; }
    .tag-screenx { background-color: #7209b7; }
    .tag-2d { background-color: #6b7280; }
    .info-window p {
      color: #4b5563;
      margin-bottom: 6px;
      font-size: 12px;
    }
    .info-window a {
      color: #e50914;
      text-decoration: none;
      font-weight: bold;
      font-size: 12px;
      display: inline-block;
      margin-top: 4px;
    }
  </style>
  <!-- 카카오맵 API (YOUR_KAKAO_MAP_API_KEY 부분에 본인 API 키 입력) -->
  <script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=23bd2ab8a894761d1b68c263c015b43a&libraries=services"></script>
</head>
<body>

  <header>
    <h1>🎬 영화관 상영 포맷 스폿 지도</h1>
    <p>주변 영화관과 IMAX · Dolby · 4DX 특별관 보유 여부를 확인하세요!</p>
  </header>

  <div class="control-panel">
    <span style="font-size: 0.85rem; font-weight: bold; color: #4b5563; margin-right: 4px;">포맷 필터:</span>
    <button class="btn active" onclick="filterFormat('ALL', this)">전체 보기</button>
    <button class="btn" onclick="filterFormat('IMAX', this)">IMAX</button>
    <button class="btn" onclick="filterFormat('DOLBY', this)">Dolby Cinema</button>
    <button class="btn" onclick="filterFormat('4DX', this)">4DX / ScreenX</button>
    <button class="btn btn-location" onclick="moveToCurrentLocation()">📍 내 위치</button>
  </div>

  <div id="map"></div>

  <script>
    let map;
    let ps;
    let infowindow;
    let currentOverlay = null;
    let allCinemaData = [];
    let activeMarkers = [];
    let userLocationMarker = null;

    let currentLat = 37.5665;
    let currentLng = 126.9780;

    // 🍿 인터넷 연결 방식 팝콘 아이콘 링크
    const cinemaMarkerImageSrc = 'https://cdn-icons-png.flaticon.com/512/2907/2907444.png'; 
    const imageSize = new kakao.maps.Size(44, 44);
    const imageOption = { offset: new kakao.maps.Point(22, 44) };
    const markerImage = new kakao.maps.MarkerImage(cinemaMarkerImageSrc, imageSize, imageOption);

    function initMap() {
      const container = document.getElementById('map');
      const options = {
        center: new kakao.maps.LatLng(currentLat, currentLng),
        level: 4
      };

      map = new kakao.maps.Map(container, options);
      ps = new kakao.maps.services.Places();
      infowindow = new kakao.maps.InfoWindow({ zIndex: 1 });

      moveToCurrentLocation();
    }

    function moveToCurrentLocation() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          (position) => {
            currentLat = position.coords.latitude;
            currentLng = position.coords.longitude;
            const locPosition = new kakao.maps.LatLng(currentLat, currentLng);

            if (userLocationMarker) userLocationMarker.setMap(null);

            userLocationMarker = new kakao.maps.Marker({
              map: map,
              position: locPosition
            });

            map.setCenter(locPosition);
            showCustomOverlay(locPosition, '📍 현재 위치');
            searchCinemas();
          },
          () => {
            alert('현재 위치 정보를 불러올 수 없습니다.');
            searchCinemas();
          }
        );
      } else {
        searchCinemas();
      }
    }

    function searchCinemas() {
      const center = map.getCenter();
      
      ps.keywordSearch('영화관', (data, status) => {
        if (status === kakao.maps.services.Status.OK) {
          allCinemaData = data;
          renderCinemas(allCinemaData);
        } else {
          alert('주변에서 영화관을 찾지 못했습니다.');
        }
      }, {
        location: center,
        radius: 6000
      });
    }

    // 영화관별 제공 포맷 구분 함수
    function getCinemaFormats(name) {
      const formats = [];
      if (name.includes('CGV')) {
        formats.push({ name: '2D/3D', class: 'tag-2d' });
        if (name.includes('용산') || name.includes('왕십리') || name.includes('천호') || name.includes('소풍') || name.includes('수원')) {
          formats.push({ name: 'IMAX', class: 'tag-imax' });
        }
        formats.push({ name: '4DX', class: 'tag-4dx' });
        formats.push({ name: 'ScreenX', class: 'tag-screenx' });
      } else if (name.includes('메가박스')) {
        formats.push({ name: '2D/3D', class: 'tag-2d' });
        if (name.includes('코엑스') || name.includes('안성') || name.includes('남양주') || name.includes('대전') || name.includes('대구')) {
          formats.push({ name: 'Dolby Cinema', class: 'tag-dolby' });
        }
        formats.push({ name: 'MX', class: 'tag-dolby' });
      } else if (name.includes('롯데시네마')) {
        formats.push({ name: '2D/3D', class: 'tag-2d' });
        formats.push({ name: 'SUPER PLEX', class: 'tag-imax' });
      } else {
        formats.push({ name: '2D 일반관', class: 'tag-2d' });
      }
      return formats;
    }

    function renderCinemas(cinemaList) {
      removeMarkers();
      if (currentOverlay) currentOverlay.setMap(null);

      const bounds = new kakao.maps.LatLngBounds();

      cinemaList.forEach((place) => {
        const markerPosition = new kakao.maps.LatLng(place.y, place.x);
        const formats = getCinemaFormats(place.place_name);

        const marker = new kakao.maps.Marker({
          map: map,
          position: markerPosition,
          image: markerImage
        });

        activeMarkers.push(marker);
        bounds.extend(markerPosition);

        kakao.maps.event.addListener(marker, 'click', function () {
          let tagsHtml = formats.map(f => `<span class="tag ${f.class}">${f.name}</span>`).join('');

          const content = `
            <div class="info-window">
              <h4>${place.place_name}</h4>
              <div class="format-tags">${tagsHtml}</div>
              <p>📍 ${place.road_address_name || place.address_name}</p>
              <p>📞 ${place.phone || '전화번호 없음'}</p>
              <a href="${place.place_url}" target="_blank">상영시간표 & 예매 보기 ➔</a>
            </div>
          `;
          infowindow.setContent(content);
          infowindow.open(map, marker);

          showCustomOverlay(markerPosition, place.place_name);
        });
      });

      if (cinemaList.length > 0) {
        map.setBounds(bounds);
      }
    }

    function filterFormat(formatType, btnElement) {
      document.querySelectorAll('.control-panel .btn').forEach(btn => {
        if (!btn.classList.contains('btn-location')) btn.classList.remove('active');
      });
      btnElement.classList.add('active');

      if (formatType === 'ALL') {
        renderCinemas(allCinemaData);
      } else {
        const filtered = allCinemaData.filter(place => {
          const formats = getCinemaFormats(place.place_name);
          return formats.some(f => f.name.toUpperCase().includes(formatType));
        });
        renderCinemas(filtered);
      }
    }

    function showCustomOverlay(position, title) {
      if (currentOverlay) currentOverlay.setMap(null);

      const content = `<div class="custom-overlay">${title}</div>`;

      currentOverlay = new kakao.maps.CustomOverlay({
        map: map,
        position: position,
        content: content,
        yAnchor: 1.3
      });
    }

    function removeMarkers() {
      activeMarkers.forEach(m => m.setMap(null));
      activeMarkers = [];
    }

    window.onload = initMap;
  </script>
</body>
</html>
