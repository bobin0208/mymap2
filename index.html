<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>카카오맵 장소 검색 서비스</title>

  <!-- CSS 스타일링 -->
  <style>
    /* 여백 초기화 및 기본 폰트 설정 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      font-family: 'Noto Sans KR', sans-serif;
    }

    /* 화면을 왼쪽(검색)과 오른쪽(지도) 2분할 레이아웃 설정 */
    .container {
      display: flex;
      width: 100vw;
      height: 100vh;
    }

    /* 왼쪽 사이드바 (검색창 + 검색 결과 리스트) */
    .sidebar {
      width: 350px;
      height: 100%;
      background-color: #f8f9fa;
      border-right: 1px solid #ddd;
      display: flex;
      flex-direction: column;
      z-index: 10;
      box-shadow: 2px 0 5px rgba(0, 0, 0, 0.1);
    }

    /* 검색 영역 */
    .search-box {
      padding: 15px;
      background-color: #ffffff;
      border-bottom: 1px solid #eee;
      display: flex;
      gap: 8px;
    }

    .search-input {
      flex: 1;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 14px;
    }

    .search-button {
      padding: 10px 15px;
      background-color: #fee500; /* 카카오 대표 노란색 */
      border: none;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
      color: #191919;
    }

    .search-button:hover {
      background-color: #fada00;
    }

    /* 검색 결과 리스트 영역 (스크롤 가능) */
    .result-list {
      flex: 1;
      overflow-y: auto;
      list-style: none;
    }

    .result-item {
      padding: 15px;
      border-bottom: 1px solid #eee;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .result-item:hover {
      background-color: #e9ecef;
    }

    .result-item h4 {
      font-size: 16px;
      color: #333;
      margin-bottom: 5px;
    }

    .result-item p {
      font-size: 13px;
      color: #666;
    }

    /* 오른쪽 지도 영역 */
    .map-container {
      flex: 1;
      height: 100%;
    }
  </style>

  <!-- 
    카카오 지도 JavaScript SDK 불러오기
    libraries=services 파라미터를 추가해야 장소 검색(Keyword Search) 기능을 사용할 수 있습니다.
  -->
  <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=[내 JavaScript 키]&libraries=services&autoload=false"></script>
</head>
<body>

  <!-- 전체 메인 컨테이너 -->
  <div class="container">
    <!-- 왼쪽: 검색 영역 및 결과 리스트 -->
    <div class="sidebar">
      <form class="search-box" id="searchForm">
        <input type="text" id="keywordInput" class="search-input" placeholder="장소를 입력하세요 (예: 강남역 맛집)" required />
        <button type="submit" class="search-button">검색</button>
      </form>
      <ul id="placesList" class="result-list">
        <!-- JS로 검색 결과가 여기에 동적으로 추가됩니다 -->
      </ul>
    </div>

    <!-- 오른쪽: 지도 영역 -->
    <div id="map" class="map-container"></div>
  </div>

  <!-- JavaScript 소스코드 -->
  <script>
    // 변수 선언 (전역 변수로 관리)
    let map = null;
    let placesService = null;
    let markers = []; // 생성된 마커들을 저장할 배열
    let infoWindow = null; // 마커 클릭 시 띄울 정보창

    // 지도가 안전하게 로드된 후 실행되도록 kakao.maps.load() 사용
    kakao.maps.load(function () {
      initMap();
    });

    // 지도 및 기본 기능 초기화 함수
    function initMap() {
      const mapContainer = document.getElementById('map'); // 지도를 표시할 div
      
      // 기본 중심 좌표 (위치 권한을 받기 전 기본값: 서울시청)
      const defaultCenter = new kakao.maps.LatLng(37.566826, 126.978656); 

      // 지도 옵션 설정 (확대 레벨 5)
      const mapOptions = {
        center: defaultCenter,
        level: 5 // 지도 확대 레벨 5 설정
      };

      // 지도 객체 생성
      map = new kakao.maps.Map(mapContainer, mapOptions);

      // 장소 검색 객체(Places) 생성
      placesService = new kakao.maps.services.Places();

      // 인포윈도우(정보창) 미리 생성
      infoWindow = new kakao.maps.InfoWindow({ zIndex: 1 });

      // 현재 위치 가져오기 및 지도 중심 이동
      getCurrentLocation();

      // 검색 폼 제출 이벤트 등록
      const searchForm = document.getElementById('searchForm');
      searchForm.addEventListener('submit', function (e) {
        e.preventDefault(); // 폼 제출 시 페이지가 새로고침되는 현상 방지
        searchPlaces();
      });
    }

    // 브라우저의 Geolocation API로 현재 위치를 가져와 지도의 중심 좌표 설정
    function getCurrentLocation() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          function (position) {
            const currentLat = position.coords.latitude;  // 위도
            const currentLng = position.coords.longitude; // 경도
            const currentPosition = new kakao.maps.LatLng(currentLat, currentLng);

            // 지도 중심을 현재 위치로 이동
            map.setCenter(currentPosition);

            // 현재 위치에 표시할 마커 생성
            const currentMarker = new kakao.maps.Marker({
              position: currentPosition,
              map: map
            });
          },
          function (error) {
            console.warn('위치 정보를 가져오는데 실패했습니다. 기본 위치로 표시합니다.', error);
          }
        );
      } else {
        alert('이 브라우저에서는 위치 서비스(Geolocation)를 지원하지 않습니다.');
      }
    }

    // 키워드로 장소를 검색하는 함수
    function searchPlaces() {
      const keyword = document.getElementById('keywordInput').value.trim();

      if (!keyword) {
        alert('키워드를 입력해주세요!');
        return;
      }

      // 카카오 키워드 검색 API 호출
      placesService.keywordSearch(keyword, placesSearchCB);
    }

    // 장소 검색이 완료되었을 때 실행되는 콜백 함수
    function placesSearchCB(data, status, pagination) {
      if (status === kakao.maps.services.Status.OK) {
        // 정상적으로 검색되었으면 결과 목록과 마커를 출력
        displayPlaces(data);
      } else if (status === kakao.maps.services.Status.ZERO_RESULT) {
        alert('검색 결과가 존재하지 않습니다.');
      } else if (status === kakao.maps.services.Status.ERROR) {
        alert('검색 결과 중 오류가 발생했습니다.');
      }
    }

    // 검색 결과 목록과 지도 위에 마커를 표시하는 함수
    function displayPlaces(places) {
      const listElement = document.getElementById('placesList');
      const bounds = new kakao.maps.LatLngBounds(); // 검색된 장소들을 한눈에 보여줄 지도 범위를 계산하는 객체

      // 기존에 그려진 검색 결과 리스트와 마커 지우기
      listElement.innerHTML = '';
      removeMarkers();

      for (let i = 0; i < places.length; i++) {
        const placePosition = new kakao.maps.LatLng(places[i].y, places[i].x);
        
        // 1. 마커 생성 및 지도 표시
        const marker = addMarker(placePosition);
        
        // 2. 검색 결과 리스트 아이템 HTML 요소 생성
        const itemElement = document.createElement('li');
        itemElement.className = 'result-item';
        itemElement.innerHTML = `
          <h4>${places[i].place_name}</h4>
          <p>${places[i].road_address_name || places[i].address_name}</p>
        `;

        // 리스트 항목이나 마커를 클릭했을 때 인포윈도우(정보창) 띄우기
        (function (marker, title, position) {
          kakao.maps.event.addListener(marker, 'click', function () {
            displayInfoWindow(marker, title);
          });

          itemElement.onclick = function () {
            displayInfoWindow(marker, title);
            map.panTo(position); // 클릭한 장소로 지도 부드럽게 이동
          };
        })(marker, places[i].place_name, placePosition);

        listElement.appendChild(itemElement);

        // 지도 범위를 설정하기 위해 좌표 추가
        bounds.extend(placePosition);
      }

      // 검색된 장소들이 모두 보이도록 지도의 범위를 재설정
      map.setBounds(bounds);
    }

    // 지도 위에 마커를 하나 생성하는 함수
    function addMarker(position) {
      const marker = new kakao.maps.Marker({
        position: position,
        map: map
      });
      markers.push(marker); // 추후 삭제를 위해 배열에 보관
      return marker;
    }

    // 이전 마커들을 모두 지도에서 제거하는 함수
    function removeMarkers() {
      for (let i = 0; i < markers.length; i++) {
        markers[i].setMap(null);
      }
      markers = [];
    }

    // 마커 클릭 시 정보창을 보여주는 함수
    function displayInfoWindow(marker, title) {
      const content = `<div style="padding:5px;font-size:12px;color:#333;">${title}</div>`;
      infoWindow.setContent(content);
      infoWindow.open(map, marker);
    }
  </script>
</body>
</html>
