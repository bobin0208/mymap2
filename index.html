<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>영화관 포맷 & 실시간 상영 영화 지도</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      background-color: #f8f9fa;
    }
    header {
      background-color: #111827;
      color: #ffffff;
      padding: 14px 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    header h1 {
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 2px;
    }
    header p {
      font-size: 0.8rem;
      color: #9ca3af;
    }
    .control-panel {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 10px 16px;
      background-color: #ffffff;
      border-bottom: 1px solid #e5e7eb;
      align-items: center;
    }
    .btn {
      padding: 6px 12px;
      border: 1px solid #d1d5db;
      border-radius: 16px;
      background-color: #ffffff;
      color: #374151;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.8rem;
      transition: all 0.2s;
    }
    .btn.active {
      background-color: #e50914;
      color: #ffffff;
      border-color: #e50914;
    }
    .btn-location {
      margin-left: auto;
      background-color: #1f2937;
      color: #ffffff;
      border: none;
    }

    .main-container {
      display: flex;
      flex: 1;
      overflow: hidden;
    }
    #map {
      flex: 1;
      height: 100%;
    }
    .sidebar {
      width: 320px;
      background: #ffffff;
      border-left: 1px solid #e5e7eb;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }
    .sidebar-header {
      padding: 12px 16px;
      background: #f3f4f6;
      border-bottom: 1px solid #e5e7eb;
